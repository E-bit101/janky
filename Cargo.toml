[package]
name = "janky"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"

# These fields configure default behavior for uploads with `cargo v5`.
[package.metadata.v5]
upload-strategy = "differential"
slot = 1
icon = "cool-x"
compress = true

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive", "must_cast"] }
vexide = {version = "0.8.0", features = ["full", "default-sdk"]}
slint = { version = "1.14.1", default-features = false, features = ["compat-1-2", "renderer-software", "libm"] }
vex-sdk = "0.28.0"
vexide-slint = { git = "https://github.com/vexide/vexide-slint", branch = "main" }
vexide-motorgroup = "2.1.0"
pid = "4.0.0"

[build-dependencies]
slint-build = "1.9.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
